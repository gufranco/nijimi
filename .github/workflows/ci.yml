name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, coverage, build and E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - name: Run every gate inside the dev container
        run: make ci
